name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:python
      - run: npm run test:learning
      - run: xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-validation
          path: |
            docs/python-validation.json
            docs/learning-validation.json
            docs/desktop-validation.json
            docs/desktop-validation.png
  linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:linux -- ${{ matrix.arch }}
      - if: matrix.arch == 'x64'
        run: xvfb-run -a node scripts/smoke-linux-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS-Linux-*.txt
            docs/linux-release-*.json
            docs/linux-package-smoke.json
  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run release:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/LEIA-ME.txt
            docs/windows-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            docs/desktop-validation.json
            docs/desktop-validation.png
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME"
